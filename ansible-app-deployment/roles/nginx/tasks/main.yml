- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Deploy Mini Shop Nginx configuration
  ansible.builtin.template:
    src: mini-shop.conf.j2
    dest: /etc/nginx/conf.d/mini-shop.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Check Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
