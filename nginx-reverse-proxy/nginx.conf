server {
    listen 80;
    server_name shop.sameur.bd;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://shop.sameur.bd$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shop.sameur.bd;

    ssl_certificate /etc/letsencrypt/live/shop.sameur.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.sameur.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}